server {

    listen 80;

    server_name app.skylux.vn;


    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;

}



server {

    listen 443 ssl http2;

    server_name app.skylux.vn;



    # SSL certificate (Cloudflare Origin Certificate / Let's Encrypt)

    ssl_certificate /etc/nginx/certs/origin.pem;

    ssl_certificate_key /etc/nginx/certs/origin-key.pem;



    # Limit upload file size
    # Phù hợp import Excel, document upload

    client_max_body_size 30m;



    # Realtime Server-Sent Events (SSE: Chat & Notifications)
    location ~ ^/api/(notifications/stream|conversations/stream|chat/conversations/[^/]+/stream) {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        # SSE Streaming Configuration
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long-lived connection timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 24h;
        proxy_read_timeout 24h;

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend REST API
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout & Zero-downtime retry configuration
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # Next.js Persistent Static Assets (Direct Serving & Long-term Immutable Cache)
    location /_next/static/ {
        alias /opt/skylux/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @frontend;
    }

    # Named fallback location to frontend container
    location @frontend {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout & Zero-downtime retry configuration
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

}