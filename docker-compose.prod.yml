services:

  frontend:
    image: ghcr.io/${REGISTRY_OWNER:-YOUR_ORG}/skylux-frontend:${APP_VERSION:-latest}

    restart: unless-stopped

    environment:
      NODE_ENV: production

    # aaPanel Nginx runs on the VPS host and proxies to this loopback port.
    ports:
      - "127.0.0.1:3002:3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
      - nextjs_static:/app/.next/static

    networks:
      - skylux


  backend:
    image: ghcr.io/${REGISTRY_OWNER:-YOUR_ORG}/skylux-backend:${APP_VERSION:-latest}

    restart: unless-stopped

    env_file:
      - .env

    # Keep the API reachable only from the VPS host reverse proxy.
    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - skylux_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - skylux



  postgres:
    image: postgres:16-alpine
    container_name: skylux-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - skylux

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - skylux

volumes:
  postgres_data:
  redis_data:
  skylux_uploads:
  nextjs_static:



networks:
  skylux:
    driver: bridge
