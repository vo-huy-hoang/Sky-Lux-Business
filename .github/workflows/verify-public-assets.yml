name: Verify Public Production Assets

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  verify-public-assets:
    name: Verify public login and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose HTTPS and verify public assets
        run: node infra/scripts/verify-public-assets.mjs
