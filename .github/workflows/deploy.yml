name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version"
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Backend Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint check (non-blocking)
        run: npm run lint || true

      - name: Unit & Integration Tests
        run: npm run test -- --runInBand

  test-frontend:
    name: Frontend Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint check (non-blocking)
        run: npm run lint || true

      - name: Unit & Integration Tests
        run: npm run test -- --runInBand

  build-and-deploy:
    name: Build & Deploy Production
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Image Owner
        id: image_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-backend:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy config files to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/**"
          target: "/opt/skylux"

      - name: Deploy production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/skylux

            # aaPanel owns public HTTPS; Compose publishes app ports on loopback.
            if [ ! -s .env ]; then
              echo "ERROR: /opt/skylux/.env is missing. Prepare production environment first."
              exit 1
            fi
            for key in DB_NAME DB_USER DB_PASSWORD JWT_SECRET; do
              value=$(grep -E "^${key}=" .env | tail -n 1 | cut -d '=' -f2- || true)
              if [ -z "$value" ] || [[ "$value" == REPLACE_* ]]; then
                echo "ERROR: ${key} is missing or still uses a placeholder in /opt/skylux/.env."
                exit 1
              fi
            done

            export APP_VERSION=${{ github.sha }}
            export REGISTRY_OWNER=${{ steps.image_owner.outputs.owner }}

            # Capture current running version for rollback safety
            PREVIOUS_APP_VERSION=$(grep '^APP_VERSION=' .env 2>/dev/null | cut -d '=' -f2 || true)
            if [ -n "$PREVIOUS_APP_VERSION" ]; then
              echo "Saving previous version: $PREVIOUS_APP_VERSION"
              touch .env.previous
              sed -i '/^APP_VERSION=/d' .env.previous 2>/dev/null || true
              echo "APP_VERSION=$PREVIOUS_APP_VERSION" >> .env.previous
            fi

            # Persist variables in .env for manual docker compose operations
            touch .env
            sed -i '/^APP_VERSION=/d' .env
            sed -i '/^REGISTRY_OWNER=/d' .env
            echo "APP_VERSION=${{ github.sha }}" >> .env
            echo "REGISTRY_OWNER=${{ steps.image_owner.outputs.owner }}" >> .env

            echo "Login to GitHub Container Registry on VPS"
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pull latest images"
            docker compose -f docker-compose.prod.yml pull

            echo "Creating pre-deployment database backup snapshot..."
            BACKUP_PREFIX="skylux_pre_deploy_${APP_VERSION:0:8}" bash infra/scripts/backup-db.sh

            echo "Run database migration"
            if ! docker compose -f docker-compose.prod.yml run --rm backend npm run migration:run:prod; then
              echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
              echo "ERROR: Database migration failed! Aborting deployment."
              echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
              exit 1
            fi

            echo "Restart services"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Verifying service health status..."
            HEALTHY=0
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:3001/api/health >/dev/null 2>&1 \
                && docker compose -f docker-compose.prod.yml exec -T frontend wget -qO- http://localhost:3000/ >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              echo "Waiting for services to become healthy ($i/12, sleep 5s)..."
              sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
              echo "ERROR: Service health check failed after 60 seconds!"
              if [ -n "$PREVIOUS_APP_VERSION" ]; then
                echo "Initiating automatic rollback to previous version: ${PREVIOUS_APP_VERSION}..."
                bash infra/scripts/rollback.sh "$PREVIOUS_APP_VERSION"
              fi
              echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
              exit 1
            fi
            echo "Services verified healthy and responding to HTTP requests."

            echo "Cleanup unused images"
            docker image prune -f
