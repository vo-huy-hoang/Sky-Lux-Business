name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version"
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Backend Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint check (non-blocking)
        run: npm run lint || true

      - name: Unit & Integration Tests
        run: npm run test -- --runInBand

  test-frontend:
    name: Frontend Test Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint check (non-blocking)
        run: npm run lint || true

      - name: Unit & Integration Tests
        run: npm run test -- --runInBand

  build-and-deploy:
    name: Build & Deploy Production
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase Image Owner
        id: image_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-frontend:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-backend:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/skylux-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy config files to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,infra/**"
          target: "/opt/skylux"

      - name: Deploy production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/skylux

            # Check for SSL certificates before proceeding
            echo "Checking SSL certificates..."
            CERT_DIR="/opt/skylux/infra/nginx/certs"
            if [ ! -f "${CERT_DIR}/origin.pem" ] || [ ! -f "${CERT_DIR}/origin-key.pem" ]; then
              echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
              echo "ERROR: SSL Certificates are missing on the VPS!"
              echo "Expected files: "
              echo "  - ${CERT_DIR}/origin.pem"
              echo "  - ${CERT_DIR}/origin-key.pem"
              echo "Please manually upload these files to the VPS before deploying."
              echo "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::"
              exit 1
            fi
            echo "SSL certificates verified successfully."

            export APP_VERSION=${{ github.sha }}
            export REGISTRY_OWNER=${{ steps.image_owner.outputs.owner }}

            # Persist variables in .env for manual docker compose operations
            touch .env
            sed -i '/^APP_VERSION=/d' .env
            sed -i '/^REGISTRY_OWNER=/d' .env
            echo "APP_VERSION=${{ github.sha }}" >> .env
            echo "REGISTRY_OWNER=${{ steps.image_owner.outputs.owner }}" >> .env

            echo "Login to GitHub Container Registry on VPS"
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pull latest images"
            docker compose -f docker-compose.prod.yml pull

            echo "Run database migration"
            docker compose -f docker-compose.prod.yml run --rm backend npm run migration:run:prod

            echo "Restart services"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Reload Nginx configuration"
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true

            echo "Cleanup unused images"
            docker image prune -f