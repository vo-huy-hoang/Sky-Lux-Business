name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-frontend:
    name: Test frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  test-backend:
    name: Test backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --runInBand

      - name: Build
        run: npm run build

  build-and-push:
    name: Build and push Docker images to GHCR
    if: github.ref == 'refs/heads/main' && needs.test-frontend.result == 'success' && needs.test-backend.result == 'success'
    needs:
      - test-frontend
      - test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: ghcr.io/vo-huy-hoang/skylux-frontend:${{ github.sha }}

      - name: Test frontend static volume synchronization and HTTP assets
        run: bash ./frontend/scripts/test-static-assets-image.sh "ghcr.io/vo-huy-hoang/skylux-frontend:${GITHUB_SHA}"

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ghcr.io/vo-huy-hoang/skylux-backend:${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        run: docker push "ghcr.io/vo-huy-hoang/skylux-frontend:${GITHUB_SHA}"

      - name: Push backend image
        run: docker push "ghcr.io/vo-huy-hoang/skylux-backend:${GITHUB_SHA}"

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: skylux-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout built commit
        uses: actions/checkout@v4

      - name: Sign approval ticket and deploy through the restricted wrapper
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          DEPLOY_APPROVAL_PRIVATE_KEY: ${{ secrets.DEPLOY_APPROVAL_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_RUN_ID" =~ ^[0-9]{1,16}$ ]]
          [[ "$DEPLOY_RUN_ATTEMPT" =~ ^[0-9]{1,4}$ ]]
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]{1,39}$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_SSH_KNOWN_HOSTS" ]]
          [[ -n "$DEPLOY_APPROVAL_PRIVATE_KEY" && -n "$GHCR_TOKEN" ]]

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$MAIN_SHA" != "$DEPLOY_SHA" ]]; then
            echo "::error::Refusing stale production deployment: built commit is not the current main HEAD."
            exit 1
          fi

          TEMP_DIR="$(mktemp -d "$RUNNER_TEMP/skylux-production.XXXXXX")"
          trap 'rm -rf -- "$TEMP_DIR"' EXIT
          SSH_KEY_FILE="$TEMP_DIR/id_key"
          KNOWN_HOSTS_FILE="$TEMP_DIR/known_hosts"
          APPROVAL_KEY_FILE="$TEMP_DIR/approval-private.pem"
          MESSAGE_FILE="$TEMP_DIR/approval-message"
          SIGNATURE_FILE="$TEMP_DIR/approval-signature"

          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY_FILE"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          printf '%s\n' "$DEPLOY_APPROVAL_PRIVATE_KEY" > "$APPROVAL_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE" "$APPROVAL_KEY_FILE"

          TICKET_TIMESTAMP="$(date -u +%s)"
          TICKET_RUN_ID="${DEPLOY_RUN_ID}-${DEPLOY_RUN_ATTEMPT}"
          printf 'SKYLUX_PRODUCTION_DEPLOY_V1\n%s\n%s\n%s' \
            "$DEPLOY_SHA" "$TICKET_TIMESTAMP" "$TICKET_RUN_ID" > "$MESSAGE_FILE"
          openssl dgst -sha256 -sign "$APPROVAL_KEY_FILE" \
            -out "$SIGNATURE_FILE" "$MESSAGE_FILE"
          [[ "$(wc -c < "$SIGNATURE_FILE" | tr -d '[:space:]')" == 384 ]]
          TICKET_SIGNATURE="$(openssl base64 -A -in "$SIGNATURE_FILE")"

          printf '%s\n%s\n%s\n%s\n%s\n' \
            "$GHCR_USERNAME" \
            "$GHCR_TOKEN" \
            "$TICKET_TIMESTAMP" \
            "$TICKET_RUN_ID" \
            "$TICKET_SIGNATURE" |
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              -o ConnectTimeout=15 \
              -i "$SSH_KEY_FILE" \
              "$VPS_USER@$VPS_HOST" \
              "sudo -n /usr/local/sbin/skylux-production-deploy $DEPLOY_SHA"

      - name: Set up Node.js for public asset verification
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify public login JavaScript and CSS assets
        run: |
          node --input-type=module <<'NODE'
          const bases = ['https://optrip.vn', 'https://www.optrip.vn'];
          const mime = (path) => path.endsWith('.js') ? /javascript|ecmascript/i : /text\/css/i;

          for (const base of bases) {
            const page = await fetch(`${base}/login`);
            if (page.status !== 200) throw new Error(`${base}/login returned HTTP ${page.status}`);
            const html = await page.text();
            const refs = new Set();
            for (const match of html.matchAll(/\b(?:src|href)=["']([^"']+)["']/gi)) {
              const asset = new URL(match[1], base);
              if (asset.origin === new URL(base).origin && /\.js(?:\?|$)|\.css(?:\?|$)/i.test(asset.pathname)) refs.add(asset.href);
            }
            const assets = [...refs];
            if (!assets.some((asset) => new URL(asset).pathname.endsWith('.js'))) {
              throw new Error(`${base}/login did not reference JavaScript assets`);
            }
            for (const asset of assets) {
              const response = await fetch(asset);
              const pathname = new URL(asset).pathname;
              const contentType = response.headers.get('content-type') || '';
              if (response.status !== 200) throw new Error(`${asset} returned HTTP ${response.status}`);
              if (!mime(pathname).test(contentType)) throw new Error(`${asset} has Content-Type ${contentType}`);
              console.log(`${base}: HTTP ${response.status} ${contentType} ${pathname}`);
            }
          }
          NODE
