server {

    listen 80;

    server_name app.skylux.vn;


    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;

}



server {

    listen 443 ssl http2;

    server_name app.skylux.vn;



    # SSL certificate (Cloudflare Origin Certificate / Let's Encrypt)

    ssl_certificate /etc/nginx/certs/origin.pem;

    ssl_certificate_key /etc/nginx/certs/origin-key.pem;



    # Limit upload file size
    # Phù hợp import Excel, document upload

    client_max_body_size 30m;



    # Backend API

    location /api/ {


        proxy_pass http://backend:3001;


        proxy_http_version 1.1;



        # Support WebSocket (Socket.IO chat, notification)

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";



        # Forward client information

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;



        # Timeout cho API xử lý lâu

        proxy_connect_timeout 60s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;

    }



    # Frontend Next.js

    location / {


        proxy_pass http://frontend:3000;


        proxy_http_version 1.1;



        # Support WebSocket nếu Next.js cần

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";



        # Forward client information

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;



        proxy_connect_timeout 60s;

        proxy_send_timeout 60s;

        proxy_read_timeout 60s;

    }

}